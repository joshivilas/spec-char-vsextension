name: Build VS Code Extension

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.0.2, 1.0.0)'
        required: false
        type: string
      version_type:
        description: 'Version bump type (if version not specified)'
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
        default: 'none'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
    
    - name: Set Version
      if: github.event_name == 'workflow_dispatch' && (github.event.inputs.version != '' || github.event.inputs.version_type != 'none')
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        if [ -n "${{ github.event.inputs.version }}" ]; then
          echo "Setting version to ${{ github.event.inputs.version }}"
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
        elif [ "${{ github.event.inputs.version_type }}" != "none" ]; then
          echo "Bumping version: ${{ github.event.inputs.version_type }}"
          npm version ${{ github.event.inputs.version_type }} --no-git-tag-version
        fi
        
        git add package.json
        git commit -m "chore: update version to $(node -p "require('./package.json').version") [skip ci]" || echo "No version changes"
        git push || echo "Nothing to push"
    
    - name: Install dependencies
      run: npm install
    
    - name: Compile TypeScript
      run: npm run compile
    
    - name: Install vsce
      run: npm install -g @vscode/vsce
    
    - name: Package extension
      run: vsce package
    
    - name: Upload VSIX artifact
      uses: actions/upload-artifact@v4
      with:
        name: special-characters-viewer-vsix
        path: '*.vsix'
        retention-days: 30
